# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "772b207205dcd34f8f3eb724972869cc"
name = "Retainify"
# NOTE: `handle` is deliberately NOT set here. The app handle is already
# "retainify" on Shopify's side (see https://apps.shopify.com/retainify).
# Declaring it in this file makes the CLI treat it as a claim on a NEW handle,
# which fails with "app_handle: App handle must be unique". Shopify also warns
# that changing a handle breaks existing app admin links.
# The plan-selection URL reads the handle from app/lib/billing/plan-url.server.js.
application_url = "https://retainify.growzar.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
# Must track the ApiVersion used in app/shopify.server.js — a drift here means
# webhook payloads are shaped for a different version than the code expects.
api_version = "2025-10"

  # Without this declaration Shopify never subscribes the topic, so the handler
  # in webhooks.app.uninstalled.jsx never runs: sessions are never cleaned up and
  # the job workers keep sending to a store that removed the app.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/paid" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/update", "checkouts/create" ]
  uri = "/webhooks/checkouts"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_customers,read_orders,read_products,write_customers,write_discounts,write_files"

[auth]
redirect_urls = [
  "https://retainify.growzar.com/auth/callback",
  "https://retainify.growzar.com/auth/shopify/callback",
  "https://retainify.growzar.com/api/auth/callback"
]

[app_proxy]
url = "https://retainify.growzar.com"
subpath = "retainify"
prefix = "apps"
